# lab-synthese — Mosquitto config (test initial, pas de TLS)
# En production : ajouter listener 8883 + certs (voir lab-secured-v3)

listener 1883
protocol mqtt

# Test initial : anonyme autorisé. En prod : allow_anonymous false + ACL.
allow_anonymous true

# ACL (actif même en anonyme : les topics sont restreints)
acl_file /mosquitto/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
